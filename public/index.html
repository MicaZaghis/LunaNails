<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turnos · Nails by Luna</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head><body><main>
<div class="top"><img src="/logo.png" alt="Luna · Diseño en uñas"></div>
<p class="sub">Reservá tu turno · <a href="https://www.instagram.com/nailsbyluna1_" target="_blank" rel="noopener">@nailsbyluna1_</a></p>
<div class="tabs" id="tabs"></div><div id="v"></div></main>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=(p,b)=>fetch("/api/"+p,b?{method:"POST",body:JSON.stringify(b)}:{}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||"Error");return j});
const dow=d=>new Date(d+"T12:00:00Z").getUTCDay(),addDays=(d,n)=>new Date(new Date(d+"T12:00:00Z").getTime()+n*864e5).toISOString().slice(0,10);
const lab=d=>new Date(d+"T12:00:00Z").toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const hh=h=>String(h).padStart(2,"0"),money=n=>"$"+Number(n).toLocaleString("es-AR");
let C,T=new Set,tab="res",done=null,mine=[],err="",busy=false,S={sv:null,date:null,time:null,name:"",tel:"",gift:false,gt:"",move:null};
const ids=()=>{try{return JSON.parse(localStorage.getItem("mis")||"[]")}catch(e){return[]}};
const add=i=>{try{const l=ids();if(!l.includes(i)){l.push(i);localStorage.setItem("mis",JSON.stringify(l))}}catch(e){}};
async function loadMine(){mine=(await Promise.all(ids().map(i=>api("get?id="+i).catch(()=>null)))).filter(Boolean)}
async function refresh(){T=new Set(await api("slots"));await loadMine()}
const reset=()=>{S={sv:null,date:null,time:null,name:S.name,tel:S.tel,gift:false,gt:"",move:null}};
const days=()=>{const o=[];for(let i=0;i<C.dias;i++){const x=addDays(C.today,i);if((C.horarios[dow(x)]||[]).length)o.push(x)}return o};
const AV=`<div class="note"><b>Antes de reservar</b><ul><li>Llegá al salón 5 o 10 minutos antes de tu turno.</li><li>Se agenda con seña, sin excepción: es lo que confirma tu turno.</li><li>Si no te presentás al turno, perdés la seña.</li></ul></div>`;
function draw(){
 $("#tabs").innerHTML=[["res",S.move?"Cambiar turno":"Reservar"],["mis","Mis turnos"]].map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l}</button>`).join("");
 $("#v").innerHTML=(err?`<div class="err">${esc(err)}</div>`:"")+(tab==="mis"?misV():done?doneV(done):resV());bind()}
function resV(){let h="";
 if(!S.move){h+=`<h2>1. Elegí el servicio</h2>`+C.servicios.map(s=>`<button class="card svc ${S.sv&&S.sv.id===s.id?"on":""}" data-s="${s.id}"><span><b>${esc(s.n)}</b><br><span class="mu">aprox. 2 hs</span></span><b>${money(s.p)}</b></button>`).join("")+`<p class="mu" style="color:#fff">${esc(C.nota)}</p>`}
 else h+=`<div class="note">Estás cambiando tu turno de <b>${esc(S.sv.n)}</b>. Elegí el nuevo día y horario.</div>`;
 if(S.sv){h+=`<h2>${S.move?"1":"2"}. Elegí el día</h2><div class="row">`+days().map(d=>`<button class="chip ${S.date===d?"on":""}" data-d="${d}">${lab(d)}</button>`).join("")+`</div>`;
  if(S.date){const n=new Date(),today=S.date===C.today;h+=`<h2>${S.move?"2":"3"}. Elegí el horario</h2><div class="row">`+(C.horarios[dow(S.date)]||[]).map(x=>`<button class="chip ${S.time===x?"on":""}" data-h="${x}" ${T.has(S.date+"_"+hh(x))||(today&&x<=n.getHours())?"disabled":""}>${hh(x)}:00 hs</button>`).join("")+`</div>`}}
 if(S.sv&&S.date&&S.time!=null){
  if(S.move)h+=`<button class="btn" id="ok" ${busy?"disabled":""}>Confirmar cambio</button><button class="btn alt" id="nc">Cancelar el cambio</button>`;
  else h+=`<h2>4. Tus datos</h2><input type="text" id="nm" placeholder="Nombre y apellido" value="${esc(S.name)}"><input type="tel" id="tl" placeholder="WhatsApp (ej: 3400 123456)" value="${esc(S.tel)}"><label class="ck"><input type="checkbox" id="gf" ${S.gift?"checked":""}> Quiero canjear mi gift card</label>${S.gift?`<input type="text" id="gt" placeholder="Nombre de quien te la regaló o código" value="${esc(S.gt)}">`:""}${AV}<button class="btn" id="ok" ${busy?"disabled":""}>Solicitar turno</button>`}
 return h}
function doneV(b){return `<div class="card"><b>¡Turno solicitado!</b><p>${esc(b.sn)}<br>${lab(b.date)} · ${hh(b.time)}:00 hs<br><span class="mu">A nombre de ${esc(b.name)}</span></p></div>`+
 (b.gift?`<div class="note"><b>Gift card</b><br>Luna va a verificar tu gift card (${esc(b.gift)}). Con el canje no hace falta abonar la seña.</div>`:
 `<div class="note"><b>Falta un paso: la seña de ${money(C.sena)}</b><ul><li>Tu turno se confirma al realizar la seña, por transferencia o en efectivo.</li><li>Si no te presentás al turno, perdés la seña.</li></ul>${C.alias?`<p>Alias: <b>${esc(C.alias)}</b></p>`:""}</div><a class="btn" href="${esc(C.payUrl)}" target="_blank" rel="noopener">Realizar seña</a>`)+
 `<div class="note">Llegá 5 o 10 minutos antes. Podés cambiar o cancelar tu turno desde <b>Mis turnos</b>.</div><button class="btn alt" id="nv">Volver al inicio</button>`}
function misV(){if(!mine.length)return `<div class="card mu">No tenés turnos guardados en este dispositivo.</div>`;
 return [...mine].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(b=>`<div class="card"><b>${esc(b.sn)}</b><br>${lab(b.date)} · ${hh(b.time)}:00 hs<div style="margin-top:6px"><button class="x" data-ch="${b.id}">Cambiar turno</button><button class="x" data-cx="${b.id}">Cancelar</button></div></div>`).join("")+`<div class="note">Recordá: si no te presentás al turno, perdés la seña.</div>`}
function bind(){const q=(s,f)=>document.querySelectorAll(s).forEach(f);
 q("[data-t]",b=>b.onclick=()=>{tab=b.dataset.t;done=null;err="";draw()});
 q("[data-s]",b=>b.onclick=()=>{S.sv=C.servicios.find(x=>x.id===b.dataset.s);S.time=null;draw()});
 q("[data-d]",b=>b.onclick=async()=>{S.date=b.dataset.d;S.time=null;T=new Set(await api("slots"));draw()});
 q("[data-h]",b=>b.onclick=()=>{S.time=+b.dataset.h;draw()});
 const nm=$("#nm"),tl=$("#tl"),gt=$("#gt");if(nm)nm.oninput=()=>S.name=nm.value;if(tl)tl.oninput=()=>S.tel=tl.value;if(gt)gt.oninput=()=>S.gt=gt.value;
 if($("#gf"))$("#gf").onchange=e=>{S.gift=e.target.checked;draw()};
 if($("#ok"))$("#ok").onclick=save;if($("#nc"))$("#nc").onclick=()=>{reset();draw()};
 if($("#nv"))$("#nv").onclick=()=>{done=null;reset();draw()};
 q("[data-ch]",b=>b.onclick=()=>{const x=mine.find(m=>m.id===b.dataset.ch);reset();S.move=x.id;S.sv={id:x.servicio,n:x.sn};tab="res";err="";draw()});
 q("[data-cx]",b=>b.onclick=async()=>{if(!confirm("¿Cancelar este turno?"))return;try{await api("cancel",{id:b.dataset.cx});await refresh();err=""}catch(e){err=e.message}draw()})}
async function save(){err="";
 if(!S.move&&(!S.name.trim()||S.tel.replace(/\D/g,"").length<8)){err="Completá tu nombre y un WhatsApp válido.";return draw()}
 busy=true;draw();
 try{
  if(S.move){await api("move",{id:S.move,date:S.date,time:S.time});reset();tab="mis"}
  else{const b=await api("book",{name:S.name,tel:S.tel,servicio:S.sv.id,date:S.date,time:S.time,gift:S.gift?(S.gt.trim()||"sí"):""});add(b.id);done=b;reset()}
  await refresh()
 }catch(e){err=e.message;S.time=null;T=new Set(await api("slots").catch(()=>[]))}
 busy=false;draw()}
(async()=>{try{C=await api("config");const q=new URLSearchParams(location.search).get("t");if(q)add(q);await refresh();draw()}catch(e){$("#v").innerHTML=`<div class="err">No pudimos cargar los turnos. Probá de nuevo en un rato.</div>`}})();
</script></body></html>
